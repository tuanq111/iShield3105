name: iShieldPro
options:
  bundleIdPrefix: com.apple.mobile
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_BITCODE: "NO"
    DEAD_CODE_STRIPPING: "NO"
    CLANG_ENABLE_OBJC_ARC: "YES"
    CLANG_ENABLE_MODULES: "YES"

targets:
  iShieldPro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iShieldPro
        excludes:
          - "**/*.md"
    dependencies:
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: CallKit.framework
      - sdk: PhotosUI.framework
      - sdk: ImageIO.framework
      - sdk: AdSupport.framework
      - sdk: AppTrackingTransparency.framework
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_NAME: iShieldPro
        PRODUCT_MODULE_NAME: iShieldPro
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
        INFOPLIST_FILE: iShieldPro/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: iShieldPro/Core/ContainerBridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lresolv"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: "wholemodule"
          VALIDATE_PRODUCT: "NO"

schemes:
  iShieldPro:
    build:
      targets:
        iShieldPro: all
    run:
      config: Debug
    archive:
      config: Release
