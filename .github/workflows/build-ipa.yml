name: Build Unsigned iShield3105 IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build iShield3105 (Release / iphoneos / Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Toolchain Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: xcodegen generate --spec project.yml

      - name: Build Unsigned Release .app (iphoneos)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iShield3105.xcodeproj \
            -scheme iShield3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Verify Built App Bundle & Package Unsigned .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/iShield3105.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Built .app not found at $APP_PATH"
            find build -maxdepth 5
            exit 1
          fi

          # Verify executable, Info.plist, Bundle ID and compiled assets
          test -f "$APP_PATH/iShield3105"
          file "$APP_PATH/iShield3105"
          plutil -lint "$APP_PATH/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "CFBundleIdentifier=$BUNDLE_ID"
          test "$BUNDLE_ID" = "com.apple.mobile.MobileHouseArrest"
          test -f "$APP_PATH/Assets.car"

          rm -rf Payload iShield3105-Unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          find Payload -name ".DS_Store" -delete
          xattr -cr Payload || true
          export COPYFILE_DISABLE=1
          zip -r -y iShield3105-Unsigned.ipa Payload
          rm -rf Payload

          ls -lh iShield3105-Unsigned.ipa
          unzip -l iShield3105-Unsigned.ipa | head -n 35

      - name: Upload iShield3105-Unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iShield3105-Unsigned
          path: iShield3105-Unsigned.ipa
          retention-days: 30
          if-no-files-found: error
