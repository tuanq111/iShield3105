name: Build Unsigned iShield Pro IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build iShield Pro (Release / iphoneos / Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Toolchain Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: xcodegen generate --spec project.yml

      - name: Build Unsigned Release .app (iphoneos)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iShieldPro.xcodeproj \
            -scheme iShieldPro \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Verify Built App Bundle & Package Unsigned .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/iShieldPro.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Built .app not found at $APP_PATH"
            find build -maxdepth 5
            exit 1
          fi

          # Verify executable, Info.plist, Display Name, Bundle ID and compiled assets
          test -f "$APP_PATH/iShieldPro"
          file "$APP_PATH/iShieldPro"
          plutil -lint "$APP_PATH/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist")
          echo "CFBundleIdentifier=$BUNDLE_ID"
          echo "CFBundleDisplayName=$DISPLAY_NAME"
          test "$BUNDLE_ID" = "com.apple.mobile.MobileHouseArrest"
          test "$DISPLAY_NAME" = "iShield Pro"
          test -f "$APP_PATH/Assets.car"

          # Verify zero 3105 strings leaked into binary or Info.plist
          if strings "$APP_PATH/iShieldPro" | grep -q "3105"; then
            echo "Warning: found 3105 string in binary!"
            strings "$APP_PATH/iShieldPro" | grep "3105" || true
            exit 1
          fi
          if grep -q "3105" "$APP_PATH/Info.plist"; then
            echo "Error: found 3105 in Info.plist!"
            exit 1
          fi

          rm -rf Payload iShieldPro-Unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          find Payload -name ".DS_Store" -delete
          xattr -cr Payload || true
          export COPYFILE_DISABLE=1
          zip -r -y iShieldPro-Unsigned.ipa Payload
          rm -rf Payload

          ls -lh iShieldPro-Unsigned.ipa
          unzip -l iShieldPro-Unsigned.ipa | head -n 35

      - name: Upload iShieldPro-Unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iShieldPro-Unsigned
          path: iShieldPro-Unsigned.ipa
          retention-days: 30
          if-no-files-found: error
